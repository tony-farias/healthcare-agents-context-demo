[project]
name = "context-engineering-healthcare-agents"
version = "0.1.0"
description = "Hands-on MLflow tracing workshop for healthcare AI agent context engineering"
requires-python = ">=3.10"
dependencies = ["mlflow[databricks]>=3.1,<4", "databricks-sdk>=0.50,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["notebooks"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

